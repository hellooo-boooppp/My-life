<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#8b5cf6">
<link rel="manifest" href="manifest.json">
<title>My Life — Grand Edition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101322;color:#fff;overflow:hidden}
body{display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#181b2c;border-bottom:1px solid #30344c}
.brand{font-weight:900;font-size:20px;white-space:nowrap}.pill{padding:7px 10px;border-radius:999px;background:#242943;color:#d9dcf4;font-size:12px}
#game{position:relative;flex:1;min-height:0;background:#79b86b}canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:absolute;left:12px;top:76px;width:min(390px,calc(100% - 24px));max-height:calc(100% - 88px);overflow:auto;background:rgba(22,25,42,.96);border:1px solid #3b4162;border-radius:18px;padding:14px;box-shadow:0 12px 35px rgba(0,0,0,.28)}
.hidden{display:none}.panel h2{margin:0 0 8px;font-size:20px}.sub{color:#b7bdd8;font-size:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.card{background:#222740;border:1px solid #373d5c;border-radius:14px;padding:10px;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button,select,input{font:inherit}button{border:0;border-radius:12px;padding:10px 12px;background:#8b5cf6;color:#fff;font-weight:750;cursor:pointer}button.secondary{background:#303650}button.good{background:#2e9d72}button.warn{background:#b7782f}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #444b6c;background:#15182a;color:#fff;margin:4px 0 8px}
.small{font-size:11px;color:#aeb5d3}.stat{display:flex;justify-content:space-between;padding:5px 0}.bar{height:7px;border-radius:99px;background:#343a55;overflow:hidden}.bar i{display:block;height:100%;background:#8b5cf6}.tabs{display:flex;gap:6px;overflow:auto;padding:7px;background:#15182a;border-top:1px solid #30344c}.tabs button{white-space:nowrap;padding:8px 10px;font-size:12px}.toast{position:absolute;right:14px;top:76px;background:#181b2c;border:1px solid #3b4162;padding:10px 13px;border-radius:12px;opacity:0;transform:translateY(-5px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.joystick{position:absolute;right:18px;bottom:78px;width:110px;height:110px;border-radius:50%;background:rgba(20,25,40,.38);border:1px solid rgba(255,255,255,.25)}.stick{position:absolute;width:48px;height:48px;left:31px;top:31px;border-radius:50%;background:rgba(255,255,255,.55)}@media(min-width:800px){.panel{width:410px}.top{height:68px}.tabs{padding-left:14px}}
</style>
</head>
<body>
<div class="top"><div class="brand">💜 My Life</div><div class="pill" id="money">£1,500</div><div class="pill" id="weather">☀️ Sunny</div><div class="pill" id="clock">08:30</div></div>
<div id="game"><canvas id="world"></canvas><div id="toast" class="toast"></div><div id="panel" class="panel hidden"></div><div class="joystick"><div class="stick"></div></div></div>
<div class="tabs" id="tabs"></div>
<script>
const $=s=>document.querySelector(s), panel=$("#panel"), canvas=$("#world"), ctx=canvas.getContext("2d");
const hair=["Straight","Wavy","Curly","Coily","Bob","Pixie","Long Layers","Shag","High Ponytail","Low Ponytail","Messy Bun","Space Buns","Pigtails","Half-Up","Locs","Twists","Box-Braid Style","Braided Ponytail","Beaded Braids","Cornrow-Inspired","Short Curls","Long Curls","Shoulder Waves"];
const hairColours=["Black","Dark Brown","Brown","Auburn","Red","Copper","Honey Blonde","Blonde","Platinum","Ombre","Pink","Blue","Purple","Rainbow"];
const outfits=["Everyday","School Uniform","Sporty","Party","Comfy","Rainy Day","Festival","Sleepover","Formal","Winter","Summer","Holiday","Work","Luxury Casual","Red Carpet","Gala Night","Luxury Holiday","VIP Party","Luxury Streetwear","Royal Event"];
const places=["Home","School","Café","Fresh Mart","Style Street","Cinema","Sunny Park","Sports Centre","Pet Place","Car Dealership","Train Station","Airport","Beach Resort","Snowpeak Hotel","Grand City"];
const state={name:"Myra",age:14,hair:"Wavy",hairColour:"Brown",outfit:"Everyday",money:1500,energy:85,hunger:80,fun:75,social:70,weather:"Sunny",season:"Autumn",place:"Home",day:1,schoolYear:"Year 9",car:null,pet:null,bag:["Phone","Keys","Wallet","Power bank"],suitcase:[],friends:{Maya:55,Leo:35,Zara:45,Noah:25},memories:["First day in My Life"],inventory:["Backpack","Umbrella"],};
const npcs=[["Maya",.22,.30],["Leo",.39,.26],["Zara",.58,.33],["Noah",.73,.25],["Ava",.29,.63],["Sam",.52,.70],["Nia",.72,.62],["Jay",.84,.52]];
let keys={},moving=false, last=performance.now();

function save(){localStorage.setItem("my-life-grand",JSON.stringify(state));}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem("my-life-grand")||"{}"));}catch{}}
load();
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function ui(){ $("#money").textContent="£"+state.money.toLocaleString();$("#weather").textContent=(state.weather==="Rainy"?"🌧️":state.weather==="Snowy"?"❄️":"☀️")+" "+state.weather;$("#clock").textContent=state.place==="School"?"08:30":"10:15";save(); }
function panel(title,body){panel.innerHTML=`<h2>${title}</h2><div class="sub">Your choices change the world around you.</div>${body}`;panel.classList.remove("hidden")}
function closePanel(){panel.classList.add("hidden")}
function spend(n){if(state.money<n){toast("Not enough in-game money 💸");return false}state.money-=n;return true}
function earn(n){state.money+=n;toast("You earned £"+n+" 💷");ui()}
function setPlace(p){state.place=p;state.memories.push("Visited "+p);toast("Travelled to "+p);ui()}
function action(type){if(type==="eat"){state.hunger=Math.min(100,state.hunger+22);toast("Yummm 🍕");} if(type==="sleep"){state.energy=100;toast("Energy restored 💤")} if(type==="fun"){state.fun=Math.min(100,state.fun+20);toast("That was fun ✨")} if(type==="social"){state.social=Math.min(100,state.social+18);toast("Lovely chat 💬")} ui();draw();}
function home(){panel("🏠 Home",`<div class="card"><b>${state.name}'s house</b><div class="small">Living room • kitchen • bedroom • bathroom • garden • upstairs</div></div><div class="grid"><button onclick="action('eat')">🍳 Cook</button><button onclick="action('sleep')">🛏️ Sleep</button><button onclick="earn(50)">🧹 Do chores +£50</button><button onclick="panel('🛋️ Decorate', '<div class=card>Choose furniture to place around your home.</div><button onclick=toast(\\'New sofa placed! 🛋️\\')>Place sofa</button>')">🛋️ Decorate</button></div>`)}
function create(){panel("✨ Create a Sim",`<label>Name<input id=n value="${state.name}"></label><label>Age<select id=a><option>14</option><option>5</option><option>10</option><option>17</option><option>22</option><option>35</option><option>65</option></select></label><label>Hair<select id=h>${hair.map(x=>`<option ${x===state.hair?"selected":""}>${x}</option>`).join("")}</select></label><label>Hair colour<select id=hc>${hairColours.map(x=>`<option ${x===state.hairColour?"selected":""}>${x}</option>`).join("")}</select></label><label>Outfit<select id=o>${outfits.map(x=>`<option ${x===state.outfit?"selected":""}>${x}</option>`).join("")}</select></label><button onclick="state.name=$('#n').value;state.age=+$('#a').value;state.hair=$('#h').value;state.hairColour=$('#hc').value;state.outfit=$('#o').value;toast('Sim updated ✨');ui();draw()">Save Sim</button>`)}
function phone(){panel("📱 Phone",`<div class="grid"><button onclick="toast('LifeChat: Maya sent “Want to hang out?” 💬')">LifeChat</button><button onclick="toast('LifeTok is trending: #MyLifeDay 📹')">LifeTok</button><button onclick="toast('LifeTube: 3 new videos ▶️')">LifeTube</button><button onclick="toast('LifeFlix: movie night 🍿')">LifeFlix</button><button onclick="toast('LifeMaps: route ready 🗺️')">LifeMaps</button><button onclick="toast('LifeBank: £'+state.money)">LifeBank</button><button onclick="toast('LifeWeather: '+state.weather)">LifeWeather</button><button onclick="toast('LifeCalendar: birthday + events 📅')">Calendar</button></div><div class=card>🔋 Phone battery • 62%<br>🔌 Power bank packed</div>`)}
function school(){panel("🏫 School",`<div class=card><b>Willowbrook School</b><br>08:30–15:15 • ${state.schoolYear}<br>Lessons • lunch • clubs • homework • tests</div><div class=card><b>📌 Noticeboard</b><br>⚽ Football tryouts • 🎭 School production • 🎨 Art show • 🎉 School fair • 🏆 Sports tournament</div><div class=grid><button onclick="earn(25);state.memories.push('Finished homework')">📚 Homework</button><button onclick="state.social=Math.min(100,state.social+10);toast('Lunch with friends 🥪')">🥪 Cafeteria</button><button onclick="toast('Football club ⚽')">⚽ Clubs</button><button onclick="toast('New test scheduled 📝')">📝 Test</button></div>`)}
function social(){panel("💬 Social Life",Object.keys(state.friends).map(n=>`<div class=card><b>${n}</b><div class=small>Friendship ${state.friends[n]}%</div><div class=row><button onclick="state.friends['${n}']=Math.min(100,state.friends['${n}']+10);toast('${n} liked that! 💜');ui()">Chat</button><button class=secondary onclick="state.friends['${n}']=Math.max(0,state.friends['${n}']-5);toast('You had a disagreement.')">Confront</button><button class=good onclick="state.friends['${n}']=Math.min(100,state.friends['${n}']+6);toast('You made up 🤝')">Make up</button></div></div>`).join(""))}
function travel(){panel("✈️ Travel + Suitcases",`<div class=card>Airport → check-in → suitcase drop → security → boarding → flight → hotel → holiday memories.</div><div class=grid>${["Sunny Coast","Snowpeak","Palm Bay","Grand City","Pinewood"].map(x=>`<button onclick="state.suitcase=['Holiday outfits','Shoes','Toiletries','Camera','Power bank'];setPlace('${x}');toast('Suitcase packed! 🧳')">${x}</button>`).join("")}</div><div class=card>🧳 Suitcase: ${state.suitcase.length?state.suitcase.join(" • "):"Empty — pack before travelling!"}</div>`)}
function style(){panel("👗 Style + Luxury",`<div class=card>Current: <b>${state.outfit}</b><br>Hair: ${state.hair} • ${state.hairColour}</div><div class=grid>${outfits.map((x,i)=>`<button class=${i>12?"warn":""} onclick="state.outfit='${x}';toast('${x} outfit on ✨');ui();draw()">${x}</button>`).join("")}</div>`)}
function stuff(){panel("🎒 Stuff + Pets + Cars",`<div class=card>Bag: ${state.bag.join(" • ")}</div><div class=grid><button onclick="if(!state.pet&&spend(200)){state.pet='Puppy';state.memories.push('Adopted a pet 🐶');toast('Pet adopted! 🐶');ui()}">🐶 Adopt pet £200</button><button onclick="if(!state.car&&spend(900)){state.car='Mini Cruiser';toast('Car bought! 🚗');ui()}">🚗 Buy car £900</button><button onclick="state.inventory.push('Headphones');toast('Headphones bought 🎧')">🎧 Electronics</button><button onclick="earn(75)">💻 Sell a creation +£75</button></div><div class=card>Pet: ${state.pet||"None"}<br>Car: ${state.car||"None"}</div>`)}
function life(){panel("🌟 Life",`<div class=card>${state.name} • age ${state.age} • ${state.schoolYear}<div class=stat><span>Energy</span><b>${state.energy}%</b></div><div class=bar><i style="width:${state.energy}%"></i></div><div class=stat><span>Hunger</span><b>${state.hunger}%</b></div><div class=bar><i style="width:${state.hunger}%"></i></div><div class=stat><span>Fun</span><b>${state.fun}%</b></div><div class=bar><i style="width:${state.fun}%"></i></div></div><button onclick="state.day++;state.weather=['Sunny','Rainy','Snowy'][Math.floor(Math.random()*3)];toast('A new day begins 🌅');ui();draw()">🌅 New day</button><div class=card><b>Memories</b><br>${state.memories.slice(-8).map(x=>'• '+x).join('<br>')}</div>`)}
const tabs=[["🏠","Home",home],["✨","Create",create],["📱","Phone",phone],["🏫","School",school],["💬","Social",social],["✈️","Travel",travel],["👗","Style",style],["🎒","Stuff",stuff],["🌟","Life",life]];
tabs.forEach(([i,t,f])=>{const b=document.createElement("button");b.textContent=i+" "+t;b.onclick=f;$("#tabs").appendChild(b)});

function resize(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}
function building(x,y,w,h,name,emoji){ctx.fillStyle="#d9c2a5";ctx.fillRect(x,y,w,h);ctx.fillStyle="#8d4e50";ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x+w/2,y-24);ctx.lineTo(x+w+8,y);ctx.closePath();ctx.fill();ctx.fillStyle="#2d3146";ctx.fillRect(x+w*.42,y+h*.48,28,40);ctx.fillStyle="#e9f3ff";ctx.fillRect(x+14,y+24,28,22);ctx.fillRect(x+w-42,y+24,28,22);ctx.fillStyle="#fff";ctx.font="bold 11px system-ui";ctx.fillText(emoji+" "+name,x,y+h+15)}
function draw(){const W=canvas.clientWidth,H=canvas.clientHeight;ctx.clearRect(0,0,W,H);ctx.fillStyle="#7dbd6b";ctx.fillRect(0,0,W,H);ctx.fillStyle="#5c6778";ctx.fillRect(0,H*.43,W,H*.18);ctx.fillStyle="#6d7788";ctx.fillRect(W*.44,0,W*.14,H);ctx.fillStyle="#5aa4d5";ctx.fillRect(W*.73,0,W*.27,H*.43);ctx.fillStyle="#3f8753";for(let i=0;i<35;i++){let x=(i*97)%W,y=(i*53)%(H*.9);ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill()}building(W*.05,H*.12,W*.18,H*.18,"Home","🏠");building(W*.29,H*.10,W*.18,H*.18,"School","🏫");building(W*.51,H*.10,W*.18,H*.18,"Café","☕");building(W*.08,H*.68,W*.18,H*.16,"Style","👗");building(W*.31,H*.66,W*.18,H*.16,"Cinema","🎬");building(W*.55,H*.66,W*.18,H*.16,"Mart","🛒");building(W*.78,H*.55,W*.16,H*.18,"Airport","✈️");
npcs.forEach(([n,rx,ry],i)=>{let x=W*rx,y=H*ry;ctx.fillStyle=["#f2b5a7","#8e5a44","#d9a066","#6d4d3e"][i%4];ctx.beginPath();ctx.arc(x,y-12,9,0,7);ctx.fill();ctx.fillStyle=["#7c4a31","#222","#6b3928","#d1a66a"][i%4];ctx.fillRect(x-8,y-3,16,23);ctx.fillStyle="#fff";ctx.font="10px system-ui";ctx.fillText(n,x-14,y+34)});
let px=W*.47,py=H*.49;ctx.fillStyle="#f0b89f";ctx.beginPath();ctx.arc(px,py-13,10,0,7);ctx.fill();ctx.fillStyle=state.hairColour==="Pink"?"#e77bb7":state.hairColour==="Blonde"?"#e0b95d":"#5a3827";ctx.fillRect(px-10,py-23,20,7);ctx.fillStyle="#8b5cf6";ctx.fillRect(px-10,py-3,20,25);ctx.fillStyle="#fff";ctx.font="bold 12px system-ui";ctx.fillText(state.name,px-22,py+40);ctx.fillStyle="rgba(0,0,0,.45)";ctx.font="bold 13px system-ui";ctx.fillText("Tap a tab to live your day • drag the joystick to move",16,H-18)}
window.addEventListener("resize",resize);resize();ui();
</script>
</body></html>
