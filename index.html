<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8b5cf6"><link rel="manifest" href="manifest.json"><title>My Life — Master Plus</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#eee7ff,#fff);color:#29243a}header{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(12px);padding:14px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #eee}h1{font-size:20px;margin:0}main{max-width:1100px;margin:auto;padding:16px 16px 90px}.pill,.badge{background:#efe7ff;color:#633bc2;padding:6px 10px;border-radius:99px;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 14px}.tabs button,.btn{border:0;border-radius:14px;padding:10px 14px;background:#fff;box-shadow:0 3px 12px #39215d12;font-weight:700;color:#29243a}.tabs .active,.primary{background:#8b5cf6!important;color:#fff!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border:1px solid #eee8f8;border-radius:22px;padding:16px;box-shadow:0 8px 25px #39215d0c}.hero{display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:center}.avatar{width:120px;height:150px;border-radius:28px;background:linear-gradient(160deg,#ddd,#f5f0ff);display:flex;align-items:center;justify-content:center;font-size:64px;margin:auto;position:relative}.hair{position:absolute;font-size:70px;transform:translateY(-18px)}.small{color:#756d87;font-size:13px}.stat{margin:10px 0}.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden}.fill{height:100%;background:#8b5cf6;border-radius:99px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:110px}.item{padding:11px;border-radius:15px;background:#faf8ff;margin:7px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.field{display:grid;gap:6px;margin:10px 0}input,select{padding:11px;border:1px solid #ddd;border-radius:12px;font:inherit;width:100%}.room{height:170px;border:2px dashed #d9cdf4;border-radius:18px;background:#fffaf4;position:relative}.furn{position:absolute;background:#e7dcff;border-radius:10px;padding:8px;font-size:12px}.danger{background:#ffe8e8;color:#b72e2e}.weather{font-size:34px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#29243a;color:#fff;padding:12px 16px;border-radius:14px;display:none;z-index:20}@media(max-width:650px){.hero{grid-template-columns:1fr;text-align:center}}
</style></head><body><header><h1>✨ My Life — Master Plus</h1><span class="pill" id="money"></span></header><main><div class="tabs" id="tabs"></div><section id="app"></section></main><div class="toast" id="toast"></div>
<script>
const K="mylife-plus-v1", fresh={sim:{name:"My Sim",hair:"Long",hairColor:"#4b2e24",outfit:"Casual",personality:"Creative"},money:1500,needs:{hunger:80,energy:85,mood:80},career:{job:"Student",level:1,progress:35},house:{rooms:["Bedroom","Living Room"],items:["Bed","Sofa","Desk"],level:1},family:[{name:"My Sim",role:"You"}],friends:[],pets:[],cars:[],wardrobe:["Casual","School","Sporty","Party","Comfy"],weather:"☀️",season:"Spring",day:1,location:"Home",achievements:[],events:[]};
let s=JSON.parse(localStorage.getItem(K)||"null")||fresh,tab="Home";
function save(){localStorage.setItem(K,JSON.stringify(s))}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function setTab(x){tab=x;render()} function B(t,f,c="btn"){return `<button class="${c}" onclick="${f}">${t}</button>`}
function stat(n,v){return `<div class="stat"><div class="row"><b>${n}</b><span>${v}%</span></div><div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`}
function avatar(){return `<div class="avatar">🙂<span class="hair" style="color:${s.sim.hairColor}">${s.sim.hair==="Short"?"◼":"〰"}</span></div>`}
function render(){document.getElementById("money").textContent="£"+s.money.toLocaleString();document.getElementById("tabs").innerHTML=["Home","Create","Build","Family","Social","Pets","Cars","Wardrobe","Town","Life","Events","Achievements"].map(x=>`<button class="${tab==x?"active":""}" onclick="setTab('${x}')">${x}</button>`).join("");document.getElementById("app").innerHTML=({Home,Create,Build,Family,Social,Pets,Cars,Wardrobe,Town,Life,Events,Achievements}[tab]||Settings)()}
function Home(){return `<div class="card hero">${avatar()}<div><h2>Hey, ${s.sim.name}! 👋</h2><p class="small">Day ${s.day} · ${s.weather} ${s.season} · ${s.location}</p>${stat("Hunger",s.needs.hunger)}${stat("Energy",s.needs.energy)}${stat("Mood",s.needs.mood)}<div class="actions">${B("🍕 Eat","act('eat')","btn primary")}${B("😴 Rest","act('rest')")}${B("🎨 Fun","act('fun')")}</div></div></div><div class="grid" style="margin-top:14px"><div class="card"><h3>🏠 Home</h3><p>${s.house.rooms.length} rooms · ${s.house.items.length} items</p>${B("Build","setTab('Build')","btn primary")}</div><div class="card"><h3>🌦️ Today</h3><div class="weather">${s.weather}</div><p>${s.season} day ${s.day}</p>${B("New day","newDay()")}</div><div class="card"><h3>🚗 Transport</h3><p>${s.cars.length} car(s)</p>${B("Cars","setTab('Cars')")}</div></div>`}
function act(x){if(x==="eat"){s.needs.hunger=Math.min(100,s.needs.hunger+25);s.money=Math.max(0,s.money-12)}if(x==="rest"){s.needs.energy=Math.min(100,s.needs.energy+30);newDay()}if(x==="fun"){s.needs.mood=Math.min(100,s.needs.mood+22);s.needs.energy=Math.max(0,s.needs.energy-8)}save();render();toast("Done! ✨")}
function newDay(){s.day++;s.needs.hunger=Math.max(0,s.needs.hunger-12);s.needs.energy=Math.max(0,s.needs.energy-8);let ws=["☀️","🌧️","⛅","🌤️"];s.weather=ws[Math.floor(Math.random()*ws.length)];let ev=["A friend invited you out!","You found a surprise £25!","Your pet wants attention!","A café gave you a free treat!"];s.events.unshift(ev[Math.floor(Math.random()*ev.length)]);if(Math.random()<.35){s.money+=25;toast("Surprise! +£25 🎁")}save();render()}
function Create(){return `<div class="card"><h2>✨ Create-a-Sim</h2><div class="grid"><div>${avatar()}</div><div><div class="field"><label>Name</label><input id="nm" value="${s.sim.name}"></div><div class="field"><label>Hair</label><select id="ha">${["Short","Long","Curly","Bun"].map(x=>`<option ${s.sim.hair==x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Hair colour</label><input type="color" id="hc" value="${s.sim.hairColor}"></div><div class="field"><label>Outfit</label><select id="ou">${["Casual","School","Sporty","Party","Comfy"].map(x=>`<option ${s.sim.outfit==x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Personality</label><select id="pe">${["Creative","Confident","Kind","Bookish","Adventurous"].map(x=>`<option ${s.sim.personality==x?"selected":""}>${x}</option>`).join("")}</select></div>${B("Save character","saveSim()","btn primary")}</div></div></div>`}
function saveSim(){Object.assign(s.sim,{name:nm.value,hair:ha.value,hairColor:hc.value,outfit:ou.value,personality:pe.value});s.family[0].name=s.sim.name;save();render();toast("Character saved 💜")}
function Build(){return `<div class="card"><h2>🏠 Build Mode</h2><div class="grid">${s.house.rooms.map((r,i)=>`<div class="room"><b style="position:absolute;left:12px;top:10px">${r}</b>${s.house.items.slice(i*3,i*3+3).map((x,j)=>`<span class="furn" style="left:${15+j*27}%;top:${55+j*12}%">${x}</span>`).join("")}</div>`).join("")}</div><div class="actions">${B("➕ Room £250","room()","btn primary")}${B("🛋️ Sofa £120","buy('Sofa',120)")}${B("🛏️ Bed £180","buy('Bed',180)")}${B("📚 Desk £90","buy('Desk',90)")}</div></div>`}
function buy(n,c){if(s.money<c)return toast("Not enough money 💸");s.money-=c;s.house.items.push(n);if(s.house.items.length>=7&&!s.achievements.includes("builder"))s.achievements.push("builder");save();render();toast(n+" added!")}
function room(){if(s.money<250)return toast("Not enough money 💸");s.money-=250;s.house.rooms.push("New Room");save();render();toast("New room unlocked! 🏡")}
function Family(){return `<div class="card"><h2>👨‍👩‍👧 Household</h2>${s.family.map((f,i)=>`<div class="item row">🧑 ${f.name} <span class="badge">${f.role}</span>${i?B("Remove","s.family.splice("+i+",1);save();render()","btn danger"):""}</div>`).join("")}<div class="grid"><input id="fn" placeholder="Family member name"><select id="fr"><option>Sibling</option><option>Parent</option><option>Grandparent</option></select></div>${B("Add family member","addFam()","btn primary")}</div>`}
function addFam(){if(!fn.value.trim())return;s.family.push({name:fn.value.trim(),role:fr.value});save();render();toast("Family member added 💕")}
function Social(){let ns=["Ava","Maya","Zara","Leo","Noah","Sienna"];return `<div class="card"><h2>💜 Social Life</h2>${ns.map(n=>{let f=s.friends.find(x=>x.name==n);return `<div class="item row"><span>🙂 <b>${n}</b><br><span class="small">Friendship: ${f?f.level:0}/100</span></span>${B(f?"Talk 💬":"Meet 👋","socialAct('"+n+"')")}</div>`}).join("")}</div>`}
function socialAct(n){let f=s.friends.find(x=>x.name==n);if(!f){f={name:n,level:10};s.friends.push(f)}else f.level=Math.min(100,f.level+15);if(f.level>=50&&!s.achievements.includes("bestie"))s.achievements.push("bestie");save();render();toast("Friendship +15 💜")}
function Pets(){let types=["🐶 Dog","🐱 Cat","🐰 Bunny","🐹 Hamster"];return `<div class="card"><h2>🐾 Pets</h2>${s.pets.map(p=>`<div class="item row">${p.emoji} ${p.name}<span class="badge">Happy ${p.happy}%</span></div>`).join("")}<div class="grid"><input id="pn" placeholder="Pet name"><select id="pt">${types.map(x=>`<option>${x}</option>`).join("")}</select></div>${B("Adopt pet £200","adoptPet()","btn primary")}</div>`}
function adoptPet(){if(s.money<200)return toast("You need £200 💸");let a=pt.value.split(" ");s.money-=200;s.pets.push({name:pn.value.trim()||"Buddy",emoji:a[0],happy:80});save();render();toast("New pet adopted! 🐾")}
function Cars(){return `<div class="card"><h2>🚗 Cars</h2>${s.cars.map(c=>`<div class="item">${c}</div>`).join("")}<div class="grid"><div class="card"><h3>🚙 Mini Cruiser</h3><p>£900</p>${B("Buy","car('Mini Cruiser',900)","btn primary")}</div><div class="card"><h3>🚗 City Zip</h3><p>£1,400</p>${B("Buy","car('City Zip',1400)","btn primary")}</div></div></div>`}
function car(n,c){if(s.money<c)return toast("Not enough money 💸");s.money-=c;s.cars.push(n);save();render();toast("Car purchased! 🚗")}
function Wardrobe(){return `<div class="card"><h2>👗 Wardrobe</h2><p>Outfit: <b>${s.sim.outfit}</b></p><div class="grid">${["Casual","School","Sporty","Party","Comfy","Rainy Day","Festival","Sleepover"].map(x=>`<div class="card"><h3>👕 ${x}</h3>${B(s.wardrobe.includes(x)?"Wear":"Unlock £60","outfit('${x}')",s.sim.outfit==x?"btn primary":"btn")}</div>`).join("")}</div></div>`}
function outfit(x){if(!s.wardrobe.includes(x)){if(s.money<60)return toast("Not enough money 💸");s.money-=60;s.wardrobe.push(x)}s.sim.outfit=x;save();render();toast("Outfit changed! 👗")}
function Town(){return `<div class="card"><h2>🗺️ Town</h2><div class="grid">${[["🏫","School"],["☕","Café"],["🌳","Park"],["🛍️","Shops"],["🎬","Cinema"],["🎡","Fairground"]].map(([i,n])=>`<div class="card"><h3>${i} ${n}</h3>${B("Go there","go('"+n+"')","btn primary")}</div>`).join("")}</div></div>`}
function go(n){s.location=n;s.needs.energy=Math.max(0,s.needs.energy-5);s.needs.mood=Math.min(100,s.needs.mood+8);save();render();toast("Welcome to "+n+"!")}
function Life(){return `<div class="grid"><div class="card"><h2>📚 School</h2><p>Study to build progress.</p>${B("Study +12","study()","btn primary")}</div><div class="card"><h2>💼 Career</h2><p>${s.career.job} · Level ${s.career.level}</p>${stat("Progress",s.career.progress)}${B("Work +18 / £80","work()","btn primary")}</div></div>`}
function study(){s.career.progress+=12;s.money+=25;s.needs.energy=Math.max(0,s.needs.energy-12);level();save();render()}
function work(){s.career.progress+=18;s.money+=80;s.needs.energy=Math.max(0,s.needs.energy-15);level();save();render()}
function level(){if(s.career.progress>=100){s.career.level++;s.career.progress=0;toast("Level up! 🎉")}else toast("Progress made! ✨")}
function Events(){return `<div class="card"><h2>🎉 Life Events</h2><p class="small">Your days create little surprises.</p>${s.events.slice(0,8).map(e=>`<div class="item">✨ ${e}</div>`).join("")||"<p>No events yet — play a few days!</p>"}</div>`}
function Achievements(){return `<div class="card"><h2>🏆 Achievements</h2>${[["bestie","Bestie"],["builder","Home Builder"],["pet","Pet Parent"],["car","Driver"],["rich","Money Maker"]].map(([k,n])=>`<div class="item row">${s.achievements.includes(k)?"🏆":"🔒"} ${n}<span class="badge">${s.achievements.includes(k)?"Unlocked":"Locked"}</span></div>`).join("")}</div>`}
function Settings(){return `<div class="card"><h2>⚙️ Settings</h2><p>Progress saves automatically on this device.</p>${B("💾 Save now","save();toast('Saved!')","btn primary")}${B("🔄 Reset game","localStorage.removeItem(K);location.reload()","btn danger")}</div>`}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
